name: Rebuild and publish datasets

# Manual by default. A dataset rebuild pulls multi-gigabyte upstream dumps and
# rewrites published artefacts, so it should be an intentional act rather than
# something a push triggers by accident.
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: >-
          Space-separated dataset ids to rebuild, or "all".
          Datasets not rebuilt keep their existing published entry.
        required: true
        default: us-zip-cities world-leaders
  schedule:
    # Monthly. Upstream sources change slowly and every run republishes bytes.
    - cron: "0 4 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    # The Wikipedia and Wiktionary dumps take hours to fetch and parse.
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      # Upstream dumps dominate the runtime; a cache hit turns a six-hour job
      # into a twenty-minute one.
      - name: Restore upstream cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: reference-data-cache-${{ github.run_month || 'monthly' }}
          restore-keys: reference-data-cache-

      - name: Build datasets
        env:
          DATASETS: ${{ github.event.inputs.datasets || 'all' }}
        run: |
          set -euo pipefail
          if [ "$DATASETS" = "all" ]; then
            selected="us-zip-cities world-leaders celebrities on-this-day birthday-almanac name-meanings constant-digits"
          else
            selected="$DATASETS"
          fi
          for dataset in $selected; do
            echo "::group::$dataset"
            case "$dataset" in
              # The constant tiers all come from one parameterised builder
              # rather than a script each, since only the depth differs.
              constant-digits|constant-digits-*)
                python3 builders/build_constant_tiers.py "$dataset"
                ;;
              *)
                python3 "builders/build_$(echo "$dataset" | tr '-' '_').py"
                ;;
            esac
            echo "::endgroup::"
          done

      - name: Assemble and validate the manifest
        run: |
          python3 tools/build_catalog.py
          python3 tools/validate_catalog.py

      # Anything at or over 100 MB cannot be committed — GitHub rejects the
      # push outright. Those artefacts go to a Release, which allows 2 GB per
      # asset, and the manifest already points at the Release URL for them.
      - name: Publish large artefacts as a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('manifest/catalog.json').read_text())['datasets'][0]['release']['version'])")"
          tag="data-$version"

          large=()
          while IFS= read -r file; do large+=("$file"); done < <(
            find dist -type f -size +99M | sort
          )
          if [ ${#large[@]} -eq 0 ]; then
            echo "Nothing needs a Release."
            exit 0
          fi

          echo "Publishing ${#large[@]} asset(s) to $tag"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Datasets $version" \
                 --notes "Large dataset artefacts for manifest $version."
          # --clobber so a rebuild of the same version replaces the asset rather
          # than failing on a name collision.
          gh release upload "$tag" "${large[@]}" --clobber

      - name: Commit the manifest and the small artefacts
        run: |
          set -euo pipefail
          git config user.name "sybilsight-data-bot"
          git config user.email "i@am.guru"
          # Large files are excluded by .gitignore; this is the belt-and-braces
          # check, because a 200 MB blob that reaches `git add` fails the push
          # after the whole build has already run.
          oversized="$(find dist -type f -size +99M -not -name '*.release.json' | head -5)"
          if [ -n "$oversized" ] && git check-ignore -q $oversized; then
            echo "Large artefacts correctly ignored:"; echo "$oversized"
          elif [ -n "$oversized" ]; then
            echo "::error::These exceed GitHub's 100 MB blob limit and are not ignored:"
            echo "$oversized"
            exit 1
          fi
          git add dist manifest
          if git diff --cached --quiet; then
            echo "No dataset changed."
            exit 0
          fi
          git commit -m "Rebuild datasets (${{ github.event.inputs.datasets || 'scheduled' }})"
          git push
